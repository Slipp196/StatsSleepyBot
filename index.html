<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06080e">
<title>Sleep tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    background: #06080e;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(900px 620px at 12% -6%, rgba(70, 110, 210, 0.13), transparent 62%),
      radial-gradient(760px 540px at 92% 4%, rgba(130, 75, 210, 0.10), transparent 62%),
      radial-gradient(820px 600px at 50% 108%, rgba(30, 150, 120, 0.07), transparent 62%);
    pointer-events: none;
  }

  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 8px 12px 6px;
    padding-top: max(8px, env(safe-area-inset-top));
    padding-bottom: max(6px, env(safe-area-inset-bottom));
    gap: 8px;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
  }

  /* ============ HEADER ============ */
  .header {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    min-height: 30px;
  }

  .year-nav {
    display: flex;
    align-items: center;
    gap: 1px;
    justify-self: start;
  }
  .year-nav > button {
    background: none;
    border: none;
    color: rgba(255,255,255,0.30);
    font-size: 16px;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: inherit;
    line-height: 1;
    transition: background 0.15s, color 0.15s;
  }
  .year-nav > button:hover:not(:disabled) {
    background: rgba(255,255,255,0.07);
    color: #fff;
  }
  .year-nav > button:disabled { opacity: 0.16; cursor: default; }

  .year-wrap { position: relative; }
  .year-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    padding: 2px 4px;
    border-radius: 8px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 4px;
    font-family: inherit;
  }
  .year-btn .chev { opacity: 0.30; position: relative; top: -2px; }

  .year-menu {
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    min-width: 80px;
    max-height: 200px;
    overflow-y: auto;
    padding: 4px;
    display: none;
    flex-direction: column;
    gap: 1px;
    border-radius: 10px;
    background: rgba(20, 24, 34, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 18px 36px -16px rgba(0,0,0,0.95);
    z-index: 100;
  }
  .year-menu.open { display: flex; }
  .year-menu button {
    padding: 5px 10px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    font-family: inherit;
  }
  .year-menu button.active { background: rgba(120,180,255,0.13); color: #a8d4ff; }

  .date-display {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.72);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .counter {
    justify-self: end;
    display: flex;
    align-items: baseline;
    gap: 3px;
    font-variant-numeric: tabular-nums;
  }
  .counter .num { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .counter .word { font-size: 10px; color: rgba(255,255,255,0.34); }

  /* ============ DESKTOP (year-in-pixels) ============ */
  .grid-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
  }
  .grid {
    width: 100%;
    max-width: 820px;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 2px;
  }
  .month-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .month-label {
    flex-shrink: 0;
    text-align: center;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.26);
    padding-bottom: 4px;
  }
  .dots {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: repeat(31, 1fr);
    gap: 1.5px;
  }
  .dot {
    width: 100%;
    max-width: 16px;
    aspect-ratio: 1;
    border-radius: 50%;
    justify-self: center;
    align-self: center;
    padding: 0;
    border: 0;
    background: rgba(255,255,255,0.035);
    cursor: default;
    font-family: inherit;
    transition: transform 0.15s, background 0.12s, box-shadow 0.12s;
  }
  .dot.blank { visibility: hidden; }
  .dot.editable { background: rgba(255,255,255,0.085); cursor: pointer; }
  .dot.editable:hover {
    transform: scale(1.4);
    background: rgba(255,255,255,0.24);
    box-shadow: 0 0 10px rgba(255,255,255,0.22);
  }
  .dot.future { background: rgba(255,255,255,0.018); }
  .dot.locked {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 3px),
      rgba(255,255,255,0.018);
  }
  .dot[data-v="5"] { background: linear-gradient(145deg, #ef5a6e, #a11d34); box-shadow: 0 0 7px rgba(230,70,100,0.3); }
  .dot[data-v="6"] { background: linear-gradient(145deg, #33a06d, #155439); box-shadow: 0 0 7px rgba(50,160,110,0.28); }
  .dot[data-v="7"] { background: linear-gradient(145deg, #4dd184, #1d8a52); box-shadow: 0 0 9px rgba(70,200,130,0.32); }
  .dot[data-v="8"] { background: linear-gradient(145deg, #3fe0a3, #0daa6c); box-shadow: 0 0 10px rgba(70,220,160,0.4); }
  .dot[data-v="9"] { background: linear-gradient(145deg, #ffc94e, #d97e1a); box-shadow: 0 0 10px rgba(255,180,60,0.36); }
  .dot[data-v]:hover { transform: scale(1.3); filter: brightness(1.12); }
  .dot.today { outline: 2px solid rgba(150, 200, 255, 0.85); outline-offset: 1.5px; }

  /* ============ MOBILE (month calendar) ============ */
  .mobile-view {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
  }
  .month-nav button {
    width: 40px;
    height: 40px;
    border: 0;
    background: rgba(255,255,255,0.055);
    color: rgba(255,255,255,0.65);
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background 0.15s, transform 0.12s;
  }
  .month-nav button:active:not(:disabled) { transform: scale(0.94); background: rgba(255,255,255,0.12); }
  .month-nav button:disabled { opacity: 0.18; cursor: default; }

  .month-title {
    flex: 1;
    text-align: center;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.012em;
    font-variant-numeric: tabular-nums;
  }

  .dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    text-align: center;
    padding: 0 2px;
  }

  .day-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
  }

  .day-cell {
    border-radius: 15px;
    border: 0;
    padding: 0;
    font-family: inherit;
    font-size: clamp(15px, 4.5vw, 20px);
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    background: transparent;
    color: rgba(255,255,255,0.35);
    cursor: default;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.14s, background 0.14s, box-shadow 0.14s;
    -webkit-user-select: none;
    user-select: none;
  }
  .day-cell.blank { visibility: hidden; }

  .day-cell.editable {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.72);
    cursor: pointer;
  }
  .day-cell.editable:active {
    transform: scale(0.93);
    background: rgba(255,255,255,0.14);
    color: #fff;
  }

  .day-cell.future {
    background: transparent;
    color: rgba(255,255,255,0.10);
  }

  .day-cell.locked {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 6px),
      rgba(255,255,255,0.012);
    color: rgba(255,255,255,0.22);
  }

  .day-cell[data-v="5"] { background: linear-gradient(150deg, #e35a6e, #a11d34); color: #fff; box-shadow: 0 6px 18px -6px rgba(230,70,100,0.55); }
  .day-cell[data-v="6"] { background: linear-gradient(150deg, #33a06d, #155439); color: #eafff4; box-shadow: 0 6px 18px -6px rgba(50,160,110,0.5); }
  .day-cell[data-v="7"] { background: linear-gradient(150deg, #4dd184, #1d8a52); color: #04301c; box-shadow: 0 6px 18px -6px rgba(70,200,130,0.55); }
  .day-cell[data-v="8"] { background: linear-gradient(150deg, #3fe0a3, #0daa6c); color: #04301c; box-shadow: 0 6px 20px -6px rgba(70,220,160,0.6); }
  .day-cell[data-v="9"] { background: linear-gradient(150deg, #ffc94e, #d97e1a); color: #3a2200; box-shadow: 0 6px 20px -6px rgba(255,180,60,0.55); }

  .day-cell[data-v]:active { transform: scale(0.93); filter: brightness(1.1); }

  .day-cell.today {
    outline: 2px solid rgba(150, 200, 255, 0.85);
    outline-offset: -2px;
  }

  /* ============ LEGEND ============ */
  .legend {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 4px 0 2px;
    font-size: 10px;
    color: rgba(255,255,255,0.42);
    font-weight: 500;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-swatch[data-v="5"] { background: linear-gradient(145deg, #ef5a6e, #a11d34); }
  .legend-swatch[data-v="6"] { background: linear-gradient(145deg, #33a06d, #155439); }
  .legend-swatch[data-v="7"] { background: linear-gradient(145deg, #4dd184, #1d8a52); }
  .legend-swatch[data-v="8"] { background: linear-gradient(145deg, #3fe0a3, #0daa6c); }
  .legend-swatch[data-v="9"] { background: linear-gradient(145deg, #ffc94e, #d97e1a); }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(3,5,10,0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal {
    width: min(340px, 100%);
    padding: 20px 16px 16px;
    border-radius: 22px;
    text-align: center;
    background: linear-gradient(165deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: 0 36px 72px -28px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.14);
    transform: translateY(12px) scale(0.95);
    transition: transform 0.3s cubic-bezier(.16,1,.3,1);
  }
  .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

  .modal-date { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .modal-q { font-size: 11px; color: rgba(255,255,255,0.45); }

  .options { display: flex; gap: 5px; margin-top: 16px; }
  .opt {
    flex: 1 1 0;
    min-width: 0;
    padding: 14px 3px;
    border: 0;
    border-radius: 13px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    opacity: 0.55;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
    transition: opacity 0.18s, transform 0.18s, box-shadow 0.18s;
  }
  .opt:active { transform: scale(0.96); }
  .opt.selected {
    opacity: 1;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.75), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .opt[data-v="5"] { background: linear-gradient(145deg, #ef5a6e, #a11d34); color: #fff; }
  .opt[data-v="6"] { background: linear-gradient(145deg, #33a06d, #155439); color: #e8fff4; }
  .opt[data-v="7"] { background: linear-gradient(145deg, #4dd184, #1d8a52); color: #052e1b; }
  .opt[data-v="8"] { background: linear-gradient(145deg, #3fe0a3, #0daa6c); color: #04301c; }
  .opt[data-v="9"] { background: linear-gradient(145deg, #ffc94e, #d97e1a); color: #3a2200; }

  .delete-btn {
    display: none;
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border-radius: 13px;
    border: 1px solid rgba(255,90,112,0.2);
    background: rgba(255,70,92,0.08);
    color: #ff8b9b;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .delete-btn.show { display: block; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 720px) {
    .grid-wrap { display: none; }
    .mobile-view { display: flex; }
    .app { padding: 6px 10px 4px; gap: 6px; }
    .year-btn { font-size: 19px; }
    .counter .num { font-size: 15px; }
    .counter .word { font-size: 10px; }
    .date-display { font-size: 12px; }
    .legend { gap: 9px; font-size: 10px; }
  }

  @media (max-width: 380px) {
    .day-grid { gap: 5px; }
    .day-cell { border-radius: 13px; }
    .month-title { font-size: 15px; }
    .month-nav button { width: 36px; height: 36px; font-size: 18px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="year-nav">
      <button id="prevYear" type="button">‹</button>
      <div class="year-wrap">
        <button class="year-btn" id="yearBtn" type="button">
          <span id="yearLabel">2026</span>
          <svg class="chev" width="8" height="8" viewBox="0 0 10 10">
            <path d="M2 3.6 L5 6.6 L8 3.6" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="year-menu" id="yearMenu"></div>
      </div>
      <button id="nextYear" type="button">›</button>
    </div>

    <div class="date-display" id="dateDisplay">—</div>

    <div class="counter">
      <span class="num" id="countNum">0</span>
      <span class="word" id="countWord">ночей</span>
    </div>
  </header>

  <!-- DESKTOP: year in pixels -->
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <!-- MOBILE: month calendar -->
  <div class="mobile-view">
    <div class="month-nav">
      <button id="prevMonth" type="button">‹</button>
      <div class="month-title" id="monthTitle">—</div>
      <button id="nextMonth" type="button">›</button>
    </div>

    <div class="dow-row">
      <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span>
      <span>Пт</span><span>Сб</span><span>Вс</span>
    </div>

    <div class="day-grid" id="dayGrid"></div>
  </div>

  <footer class="legend">
    <div class="legend-item"><span class="legend-swatch" data-v="5"></span>&lt;6</div>
    <div class="legend-item"><span class="legend-swatch" data-v="6"></span>6</div>
    <div class="legend-item"><span class="legend-swatch" data-v="7"></span>7</div>
    <div class="legend-item"><span class="legend-swatch" data-v="8"></span>8</div>
    <div class="legend-item"><span class="legend-swatch" data-v="9"></span>9+</div>
  </footer>
</div>

<div class="modal-backdrop" id="backdrop">
  <div class="modal" role="dialog">
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-q">Сколько часов вы спали этой ночью?</div>
    <div class="options" id="options">
      <button class="opt" data-v="5">&lt;6</button>
      <button class="opt" data-v="6">6</button>
      <button class="opt" data-v="7">7</button>
      <button class="opt" data-v="8">8</button>
      <button class="opt" data-v="9">9+</button>
    </div>
    <button class="delete-btn" id="deleteBtn">Удалить запись</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  var CLOUD_KEY = "sleep_tracker_data";
  var MONTHS_SHORT = ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  var MONTHS_FULL  = ["Январь","Февраль","Март","Апрель","Май","Июнь",
                      "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  var MONTHS_GEN   = ["января","февраля","марта","апреля","мая","июня",
                      "июля","августа","сентября","октября","ноября","декабря"];
  var WEEKDAYS     = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
  var YEARS_BACK   = 9;

  var _n = new Date();
  var TODAY       = new Date(_n.getFullYear(), _n.getMonth(), _n.getDate());
  var THIS_YEAR   = TODAY.getFullYear();
  var TODAY_KEY   = keyOf(THIS_YEAR, TODAY.getMonth(), TODAY.getDate());

  var data        = {};
  var viewYear    = THIS_YEAR;                 // desktop year
  var mobileYear  = THIS_YEAR;                 // mobile month year
  var mobileMonth = TODAY.getMonth();          // 0-11
  var activeKey   = null;

  var gridEl       = document.getElementById("grid");
  var yearLabel    = document.getElementById("yearLabel");
  var yearBtn      = document.getElementById("yearBtn");
  var yearMenu     = document.getElementById("yearMenu");
  var prevBtn      = document.getElementById("prevYear");
  var nextBtn      = document.getElementById("nextYear");
  var countNum     = document.getElementById("countNum");
  var countWord    = document.getElementById("countWord");
  var dateDisplay  = document.getElementById("dateDisplay");
  var backdrop     = document.getElementById("backdrop");
  var modalDate    = document.getElementById("modalDate");
  var optionsEl    = document.getElementById("options");
  var deleteBtn    = document.getElementById("deleteBtn");
  var dayGrid      = document.getElementById("dayGrid");
  var monthTitle   = document.getElementById("monthTitle");
  var prevMonthBtn = document.getElementById("prevMonth");
  var nextMonthBtn = document.getElementById("nextMonth");

  function keyOf(y, m, d) {
    return y + "-" + String(m+1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function parseKey(k) {
    var p = k.split("-").map(Number);
    return new Date(p[0], p[1]-1, p[2]);
  }
  function diffFromToday(y, m, d) {
    return Math.round((TODAY - new Date(y, m, d)) / 86400000);
  }
  function isEditable(y, m, d) {
    var diff = diffFromToday(y, m, d);
    return diff >= 0 && diff <= 2;
  }
  function plural(n, forms) {
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return forms[0];
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return forms[1];
    return forms[2];
  }
  function formatDate(dt) {
    var wd = WEEKDAYS[dt.getDay()];
    var d = dt.getDate();
    var m = MONTHS_GEN[dt.getMonth()];
    var y = dt.getFullYear();
    return y === THIS_YEAR ? (wd + ", " + d + " " + m)
                           : (wd + ", " + d + " " + m + " " + y);
  }

  /* ============ CLOUD ============ */
  function loadFromCloud(cb) {
    if (!tg || !tg.CloudStorage) {
      try {
        var raw = localStorage.getItem(CLOUD_KEY);
        data = raw ? JSON.parse(raw) : {};
      } catch(e) { data = {}; }
      cb();
      return;
    }
    tg.CloudStorage.getItem(CLOUD_KEY, function (err, value) {
      if (!err && value) {
        try { data = JSON.parse(value); } catch(e) { data = {}; }
      } else {
        data = {};
      }
      cb();
    });
  }
  function saveToCloud() {
    var json = JSON.stringify(data);
    if (!tg || !tg.CloudStorage) {
      try { localStorage.setItem(CLOUD_KEY, json); } catch(e) {}
      return;
    }
    tg.CloudStorage.setItem(CLOUD_KEY, json, function (err) {
      if (err) console.error("Cloud save error:", err);
    });
  }

  /* ============ RENDER: DESKTOP ============ */
  function renderDesktop(animate) {
    yearLabel.textContent = viewYear;
    nextBtn.disabled = viewYear >= THIS_YEAR;
    updateCounter();
    updateDateDisplay(TODAY);

    gridEl.innerHTML = "";
    var frag = document.createDocumentFragment();
    for (var m = 0; m < 12; m++) frag.appendChild(buildMonthCol(viewYear, m));
    gridEl.appendChild(frag);

    buildYearMenu();
  }

  function buildMonthCol(year, month) {
    var col = document.createElement("div");
    col.className = "month-col";

    var label = document.createElement("div");
    label.className = "month-label";
    label.textContent = MONTHS_SHORT[month];
    col.appendChild(label);

    var dots = document.createElement("div");
    dots.className = "dots";

    var total = new Date(year, month + 1, 0).getDate();
    for (var d = 1; d <= 31; d++) {
      if (d > total) {
        var blank = document.createElement("div");
        blank.className = "dot blank";
        dots.appendChild(blank);
      } else {
        dots.appendChild(buildDot(year, month, d));
      }
    }
    col.appendChild(dots);
    return col;
  }

  function buildDot(year, month, d) {
    var key = keyOf(year, month, d);
    var el = document.createElement("button");
    el.type = "button";
    el.className = "dot";
    el.dataset.key = key;
    applyDotState(el, key, year, month, d);
    el.addEventListener("click", onDayClick);
    el.addEventListener("mouseenter", onDayEnter);
    return el;
  }

  function applyDotState(el, key, year, month, d) {
    el.classList.remove("editable", "future", "locked", "today");
    el.removeAttribute("data-v");

    var val = data[key];
    var diff = diffFromToday(year, month, d);

    if (val !== undefined && val !== null) {
      el.dataset.v = val;
    } else if (diff < 0) {
      el.classList.add("future");
    } else if (diff > 2) {
      el.classList.add("locked");
    } else {
      el.classList.add("editable");
    }
    if (key === TODAY_KEY) el.classList.add("today");
  }

  /* ============ RENDER: MOBILE ============ */
  function renderMobile() {
    monthTitle.textContent = MONTHS_FULL[mobileMonth] + " " + mobileYear;

    var atMin = (mobileYear === THIS_YEAR - YEARS_BACK && mobileMonth === 0);
    var atMax = (mobileYear === THIS_YEAR && mobileMonth === 11);
    prevMonthBtn.disabled = atMin;
    nextMonthBtn.disabled = atMax;

    dayGrid.innerHTML = "";

    var firstDow = new Date(mobileYear, mobileMonth, 1).getDay(); // 0=Вс
    var offset   = (firstDow + 6) % 7;                            // 0=Пн
    var total    = new Date(mobileYear, mobileMonth + 1, 0).getDate();

    // 6 строк × 7 столбцов = 42 ячейки
    for (var i = 0; i < 42; i++) {
      var dayNum = i - offset + 1;
      if (dayNum < 1 || dayNum > total) {
        var blank = document.createElement("div");
        blank.className = "day-cell blank";
        dayGrid.appendChild(blank);
      } else {
        dayGrid.appendChild(buildDayCell(mobileYear, mobileMonth, dayNum));
      }
    }

    updateCounter();
    updateDateDisplay(TODAY);
  }

  function buildDayCell(year, month, d) {
    var key = keyOf(year, month, d);
    var el = document.createElement("button");
    el.type = "button";
    el.className = "day-cell";
    el.dataset.key = key;
    el.textContent = d;
    applyDayCellState(el, key, year, month, d);
    el.addEventListener("click", onDayClick);
    el.addEventListener("touchstart", onDayEnter, { passive: true });
    el.addEventListener("mouseenter", onDayEnter);
    return el;
  }

  function applyDayCellState(el, key, year, month, d) {
    el.classList.remove("editable", "future", "locked", "today");
    el.removeAttribute("data-v");

    var val = data[key];
    var diff = diffFromToday(year, month, d);

    if (val !== undefined && val !== null) {
      el.dataset.v = val;
    } else if (diff < 0) {
      el.classList.add("future");
    } else if (diff > 2) {
      el.classList.add("locked");
    } else {
      el.classList.add("editable");
    }
    if (key === TODAY_KEY) el.classList.add("today");
  }

  /* ============ SHARED ============ */
  function updateCounter() {
    var prefix = viewYear + "-";
    var n = 0;
    for (var k in data) if (k.indexOf(prefix) === 0) n++;
    countNum.textContent = n;
    countWord.textContent = plural(n, ["ночь", "ночи", "ночей"]);
  }

  function updateDateDisplay(dt) {
    dateDisplay.textContent = formatDate(dt);
  }

  function onDayEnter(e) {
    var key = e.currentTarget.dataset.key;
    if (!key) return;
    updateDateDisplay(parseKey(key));
  }

  function onDayClick(e) {
    var el = e.currentTarget;
    var key = el.dataset.key;
    if (!key) return;

    var dt = parseKey(key);
    if (!isEditable(dt.getFullYear(), dt.getMonth(), dt.getDate())) {
      // лёгкая отдача
      if (el.animate) {
        el.animate(
          [{ transform: "scale(1) translateX(0)" },
           { transform: "scale(0.97) translateX(-2px)" },
           { transform: "scale(0.97) translateX(2px)" },
           { transform: "scale(1) translateX(0)" }],
          { duration: 180, easing: "ease-in-out" }
        );
      }
      return;
    }
    openModal(key, dt);
  }

  function openModal(key, dt) {
    activeKey = key;
    modalDate.textContent = formatDate(dt);

    var current = data[key];
    var opts = optionsEl.querySelectorAll(".opt");
    for (var i = 0; i < opts.length; i++) {
      opts[i].classList.toggle("selected", Number(opts[i].dataset.v) === current);
    }
    deleteBtn.classList.toggle("show", current !== undefined);
    backdrop.classList.add("open");
  }

  function closeModal() {
    backdrop.classList.remove("open");
    activeKey = null;
    updateDateDisplay(TODAY);
  }

  optionsEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".opt");
    if (!btn || !activeKey) return;
    var key = activeKey;
    data[key] = Number(btn.dataset.v);
    saveToCloud();
    patchDay(key);
    closeModal();
  });

  deleteBtn.addEventListener("click", function () {
    if (!activeKey) return;
    var key = activeKey;
    delete data[key];
    saveToCloud();
    patchDay(key);
    closeModal();
  });

  /* Обновляет день во всех видах — и в desktop-точках, и в mobile-плитках */
  function patchDay(key) {
    var els = document.querySelectorAll('[data-key="' + key + '"]');
    var dt = parseKey(key);
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.classList.contains("dot")) {
        applyDotState(el, key, dt.getFullYear(), dt.getMonth(), dt.getDate());
      } else {
        applyDayCellState(el, key, dt.getFullYear(), dt.getMonth(), dt.getDate());
      }
      if (el.animate) {
        el.animate(
          [{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }],
          { duration: 240, easing: "ease-out" }
        );
      }
    }
    updateCounter();
  }

  backdrop.addEventListener("click", function (e) {
    if (e.target === backdrop) closeModal();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (backdrop.classList.contains("open")) closeModal();
      closeYearMenu();
    }
  });

  /* ============ YEAR NAV (desktop) ============ */
  prevBtn.addEventListener("click", function () {
    if (viewYear - 1 >= THIS_YEAR - YEARS_BACK) { viewYear--; renderDesktop(); }
  });
  nextBtn.addEventListener("click", function () {
    if (viewYear + 1 <= THIS_YEAR) { viewYear++; renderDesktop(); }
  });

  function buildYearMenu() {
    yearMenu.innerHTML = "";
    for (var y = THIS_YEAR; y >= THIS_YEAR - YEARS_BACK; y--) {
      (function (yr) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = yr;
        if (yr === viewYear) b.classList.add("active");
        b.addEventListener("click", function () {
          viewYear = yr;
          closeYearMenu();
          renderDesktop();
        });
        yearMenu.appendChild(b);
      })(y);
    }
  }
  function openYearMenu() { yearMenu.classList.add("open"); }
  function closeYearMenu() { yearMenu.classList.remove("open"); }

  yearBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (yearMenu.classList.contains("open")) closeYearMenu();
    else openYearMenu();
  });
  document.addEventListener("click", function (e) {
    if (!yearMenu.contains(e.target) && !yearBtn.contains(e.target)) closeYearMenu();
  });

  /* ============ MONTH NAV (mobile) ============ */
  prevMonthBtn.addEventListener("click", function () {
    if (mobileMonth === 0) {
      if (mobileYear - 1 >= THIS_YEAR - YEARS_BACK) {
        mobileYear--;
        mobileMonth = 11;
      }
    } else {
      mobileMonth--;
    }
    renderMobile();
  });

  nextMonthBtn.addEventListener("click", function () {
    if (mobileMonth === 11) {
      if (mobileYear + 1 <= THIS_YEAR) {
        mobileYear++;
        mobileMonth = 0;
      }
    } else {
      mobileMonth++;
    }
    renderMobile();
  });

  /* Свайп по календарю (mobile) */
  var touchStartX = 0, touchStartY = 0, touchTime = 0;
  dayGrid.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchTime = Date.now();
  }, { passive: true });

  dayGrid.addEventListener("touchend", function (e) {
    if (!e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    var dt = Date.now() - touchTime;
    if (dt > 600) return;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
    if (dx > 0) {
      if (!prevMonthBtn.disabled) prevMonthBtn.click();
    } else {
      if (!nextMonthBtn.disabled) nextMonthBtn.click();
    }
  }, { passive: true });

  /* ============ START ============ */
  loadFromCloud(function () {
    renderDesktop();
    renderMobile();
  });

})();
</script>
</body>
</html>
