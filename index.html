<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06080e">
<title>Sleep tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    background: #06080e;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(900px 620px at 12% -6%, rgba(70, 110, 210, 0.13), transparent 62%),
      radial-gradient(760px 540px at 92% 4%, rgba(130, 75, 210, 0.10), transparent 62%),
      radial-gradient(820px 600px at 50% 108%, rgba(30, 150, 120, 0.07), transparent 62%);
    pointer-events: none;
  }

  /* ============ APP ============ */
  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 8px 12px 6px;
    padding-top: max(8px, env(safe-area-inset-top, 0px));
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    gap: 5px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    opacity: 0;
    transition: opacity 0.5s cubic-bezier(.22,1,.36,1);
  }
  .app.ready { opacity: 1; }

  /* ============ HEADER ============ */
  .header {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    min-height: 30px;
  }
  .app.ready .header {
    animation: slideDownIn 0.75s cubic-bezier(.22,1,.36,1) 60ms backwards;
  }
  @keyframes slideDownIn {
    from { opacity: 0; transform: translateY(-12px); filter: blur(2px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .year-nav { display: flex; align-items: center; gap: 1px; justify-self: start; }
  .year-nav > button {
    background: none; border: none;
    color: rgba(255,255,255,0.30);
    font-size: 16px; width: 24px; height: 24px;
    border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0; font-family: inherit; line-height: 1;
    transition: background 0.2s, color 0.2s;
  }
  .year-nav > button:hover:not(:disabled) { background: rgba(255,255,255,0.07); color: #fff; }
  .year-nav > button:disabled { opacity: 0.16; cursor: default; }

  .year-wrap { position: relative; }
  .year-btn {
    background: none; border: none;
    color: #fff; font-size: 22px; font-weight: 700;
    letter-spacing: -0.03em; padding: 2px 4px;
    border-radius: 8px; cursor: pointer;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: baseline; gap: 4px;
    font-family: inherit;
  }
  .year-btn .chev { opacity: 0.30; position: relative; top: -2px; }

  .year-menu {
    position: absolute; top: calc(100% + 5px); left: 0;
    min-width: 80px; max-height: 200px; overflow-y: auto;
    padding: 4px; display: none; flex-direction: column; gap: 1px;
    border-radius: 10px;
    background: rgba(20, 24, 34, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 18px 36px -16px rgba(0,0,0,0.95);
    z-index: 100;
    opacity: 0; transform: translateY(-4px);
    transition: opacity 0.2s ease, transform 0.25s cubic-bezier(.16,1,.3,1);
  }
  .year-menu.open { display: flex; opacity: 1; transform: translateY(0); }
  .year-menu button {
    padding: 5px 10px; border: none; border-radius: 7px;
    background: transparent; color: rgba(255,255,255,0.55);
    font-size: 12px; font-weight: 500; text-align: left;
    cursor: pointer; font-variant-numeric: tabular-nums;
    font-family: inherit;
  }
  .year-menu button.active { background: rgba(120,180,255,0.13); color: #a8d4ff; }

  .date-display {
    text-align: center; font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.72); white-space: nowrap;
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis;
  }

  .counter {
    justify-self: end; display: flex; align-items: baseline;
    gap: 3px; font-variant-numeric: tabular-nums;
  }
  .counter .num { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .counter .word { font-size: 10px; color: rgba(255,255,255,0.34); }

  /* ============ VIEWS ============ */
  .view-container { flex: 1; min-height: 0; position: relative; }
  .view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    gap: 3px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s cubic-bezier(.22,1,.36,1);
  }
  .view.active { opacity: 1; pointer-events: auto; }

  /* ============ MONTH VIEW ============ */
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-shrink: 0;
  }
  .month-nav button {
    width: 40px; height: 40px; border: 0;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.62);
    border-radius: 13px; font-size: 20px; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  .month-nav button:active:not(:disabled) {
    transform: scale(0.94);
    background: rgba(255,255,255,0.12);
  }
  .month-nav button:disabled { opacity: 0.16; cursor: default; }

  .month-title {
    flex: 1; text-align: center;
    font-size: 17px; font-weight: 650;
    letter-spacing: -0.012em;
    font-variant-numeric: tabular-nums;
  }

  .dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    flex-shrink: 0;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    text-align: center;
    margin-bottom: 2px;
  }

  .day-grid-wrap {
    flex: 1; min-height: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .day-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  .day-cell {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 26%;
    border: 0; padding: 0;
    font-family: inherit;
    font-size: clamp(14px, 4vw, 18px);
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    background: transparent;
    color: rgba(255,255,255,0.35);
    cursor: default;
    display: flex; align-items: center; justify-content: center;
    transition:
      transform 0.18s cubic-bezier(.2,.8,.3,1),
      background 0.18s ease,
      box-shadow 0.18s ease,
      color 0.18s ease;
  }
  .day-cell.blank { visibility: hidden; }
  .day-cell.editable {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.72);
    cursor: pointer;
  }
  .day-cell.editable:active {
    transform: scale(0.92);
    background: rgba(255,255,255,0.14);
    color: #fff;
  }
  .day-cell.future { background: transparent; color: rgba(255,255,255,0.10); }
  .day-cell.locked {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 6px),
      rgba(255,255,255,0.012);
    color: rgba(255,255,255,0.22);
  }
  .day-cell[data-v="5"] { background: linear-gradient(150deg, #e35a6e, #a11d34); color: #fff; box-shadow: 0 6px 18px -6px rgba(230,70,100,0.55); }
  .day-cell[data-v="6"] { background: linear-gradient(150deg, #33a06d, #155439); color: #eafff4; box-shadow: 0 6px 18px -6px rgba(50,160,110,0.5); }
  .day-cell[data-v="7"] { background: linear-gradient(150deg, #4dd184, #1d8a52); color: #04301c; box-shadow: 0 6px 18px -6px rgba(70,200,130,0.55); }
  .day-cell[data-v="8"] { background: linear-gradient(150deg, #3fe0a3, #0daa6c); color: #04301c; box-shadow: 0 6px 20px -6px rgba(70,220,160,0.6); }
  .day-cell[data-v="9"] { background: linear-gradient(150deg, #ffc94e, #d97e1a); color: #3a2200; box-shadow: 0 6px 20px -6px rgba(255,180,60,0.55); }
  .day-cell[data-v]:active { transform: scale(0.92); filter: brightness(1.1); }
  .day-cell.today { outline: 2px solid rgba(150, 200, 255, 0.85); outline-offset: -2px; }

  /* ============ YEAR VIEW ============ */
  .year-grid {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 2px;
  }
  .year-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .year-col-label {
    flex-shrink: 0; text-align: center;
    font-size: 8px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: rgba(255,255,255,0.26);
    padding-bottom: 4px;
  }
  .year-dots {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-rows: repeat(31, 1fr);
    gap: 1.5px;
  }
  .dot {
    height: 100%; aspect-ratio: 1 / 1;
    max-width: 100%;
    justify-self: center; align-self: center;
    border-radius: 50%; padding: 0; border: 0;
    background: rgba(255,255,255,0.035);
    cursor: default; font-family: inherit;
    transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .dot.blank { visibility: hidden; }
  .dot.editable { background: rgba(255,255,255,0.085); cursor: pointer; }
  .dot.editable:hover {
    transform: scale(1.4);
    background: rgba(255,255,255,0.24);
    box-shadow: 0 0 10px rgba(255,255,255,0.22);
  }
  .dot.future { background: rgba(255,255,255,0.018); }
  .dot.locked {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 3px),
      rgba(255,255,255,0.018);
  }
  .dot[data-v="5"] { background: linear-gradient(145deg, #ef5a6e, #a11d34); box-shadow: 0 0 7px rgba(230,70,100,0.32); }
  .dot[data-v="6"] { background: linear-gradient(145deg, #33a06d, #155439); box-shadow: 0 0 7px rgba(50,160,110,0.3); }
  .dot[data-v="7"] { background: linear-gradient(145deg, #4dd184, #1d8a52); box-shadow: 0 0 9px rgba(70,200,130,0.34); }
  .dot[data-v="8"] { background: linear-gradient(145deg, #3fe0a3, #0daa6c); box-shadow: 0 0 10px rgba(70,220,160,0.42); }
  .dot[data-v="9"] { background: linear-gradient(145deg, #ffc94e, #d97e1a); box-shadow: 0 0 10px rgba(255,180,60,0.38); }
  .dot[data-v]:hover { transform: scale(1.35); filter: brightness(1.12); }
  .dot.today { outline: 2px solid rgba(150, 200, 255, 0.85); outline-offset: 1.5px; }

  /* ============ FOOTER ============ */
  .footer {
    position: relative;
    flex-shrink: 0;
    display: flex; justify-content: center; align-items: center;
    padding: 4px 0 2px;
    min-height: 44px;
  }
  .app.ready .footer {
    animation: slideUpIn 0.75s cubic-bezier(.22,1,.36,1) 260ms backwards;
  }
  @keyframes slideUpIn {
    from { opacity: 0; transform: translateY(12px); filter: blur(2px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .legend {
    display: flex; justify-content: center; align-items: center;
    gap: 12px;
    font-size: 10px; color: rgba(255,255,255,0.42); font-weight: 500;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-swatch[data-v="5"] { background: linear-gradient(145deg, #ef5a6e, #a11d34); }
  .legend-swatch[data-v="6"] { background: linear-gradient(145deg, #33a06d, #155439); }
  .legend-swatch[data-v="7"] { background: linear-gradient(145deg, #4dd184, #1d8a52); }
  .legend-swatch[data-v="8"] { background: linear-gradient(145deg, #3fe0a3, #0daa6c); }
  .legend-swatch[data-v="9"] { background: linear-gradient(145deg, #ffc94e, #d97e1a); }

  .view-toggle {
    position: absolute; right: 0; top: 50%;
    transform: translateY(-50%);
    width: 40px; height: 40px;
    border-radius: 13px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: rgba(255,255,255,0.72);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .view-toggle:active {
    transform: translateY(-50%) scale(0.92);
    background: rgba(255,255,255,0.12);
  }
  .view-toggle svg {
    position: absolute;
    transition: opacity 0.4s cubic-bezier(.22,1,.36,1),
                transform 0.5s cubic-bezier(.22,1,.36,1);
  }
  .view-toggle .icon-year { opacity: 0; transform: rotate(60deg) scale(0.6); }
  .view-toggle .icon-month { opacity: 1; transform: rotate(0deg) scale(1); }
  .view-toggle[data-mode="month"] .icon-year { opacity: 1; transform: rotate(0deg) scale(1); }
  .view-toggle[data-mode="month"] .icon-month { opacity: 0; transform: rotate(-60deg) scale(0.6); }

  /* ============ LOADER ============ */
  .loader {
    position: fixed; inset: 0; z-index: 500;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #06080e;
    cursor: pointer;
    transition:
      opacity 0.75s cubic-bezier(.22,1,.36,1),
      transform 0.75s cubic-bezier(.22,1,.36,1),
      filter 0.75s cubic-bezier(.22,1,.36,1);
  }
  .loader::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(700px 520px at 50% 42%, rgba(90, 130, 210, 0.13), transparent 65%);
    pointer-events: none;
  }
  .loader.done {
    opacity: 0;
    transform: scale(1.08);
    filter: blur(8px);
    pointer-events: none;
  }

  .loader-svg {
    width: 220px; height: 220px;
    display: block;
    overflow: visible;
  }

  .loader-hint {
    position: absolute;
    top: calc(50% + 145px);
    left: 50%;
    transform: translate(-50%, 14px);
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    opacity: 0;
    transition:
      opacity 0.8s cubic-bezier(.22,1,.36,1),
      transform 0.8s cubic-bezier(.22,1,.36,1);
    white-space: nowrap;
    pointer-events: none;
  }
  .loader-hint.visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .ldot-g { fill: #4dd184; filter: drop-shadow(0 0 6px rgba(77,209,132,0.8)); }
  .ldot-r { fill: #ef5a6e; filter: drop-shadow(0 0 6px rgba(239,90,110,0.8)); }
  .ldot-y { fill: #ffc94e; filter: drop-shadow(0 0 6px rgba(255,201,78,0.8)); }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200;
    display: grid; place-items: center;
    padding: 16px;
    background: rgba(3,5,10,0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s cubic-bezier(.22,1,.36,1);
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal {
    width: min(340px, 100%);
    padding: 22px 18px 18px;
    border-radius: 24px;
    text-align: center;
    background: linear-gradient(165deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: 0 36px 72px -28px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.14);
    transform: translateY(18px) scale(0.94);
    opacity: 0;
    transition:
      transform 0.45s cubic-bezier(.22,1,.36,1),
      opacity 0.3s cubic-bezier(.22,1,.36,1);
  }
  .modal-backdrop.open .modal {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .modal-date { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .modal-q { font-size: 11px; color: rgba(255,255,255,0.45); }

  .options { display: flex; gap: 5px; margin-top: 16px; }
  .opt {
    flex: 1 1 0; min-width: 0;
    padding: 14px 3px;
    border: 0; border-radius: 14px;
    font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer;
    opacity: 0.55;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(.22,1,.36,1), box-shadow 0.25s ease;
  }
  .opt:active { transform: scale(0.95); }
  .opt.selected {
    opacity: 1;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.78), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .opt[data-v="5"] { background: linear-gradient(145deg, #ef5a6e, #a11d34); color: #fff; }
  .opt[data-v="6"] { background: linear-gradient(145deg, #33a06d, #155439); color: #e8fff4; }
  .opt[data-v="7"] { background: linear-gradient(145deg, #4dd184, #1d8a52); color: #052e1b; }
  .opt[data-v="8"] { background: linear-gradient(145deg, #3fe0a3, #0daa6c); color: #04301c; }
  .opt[data-v="9"] { background: linear-gradient(145deg, #ffc94e, #d97e1a); color: #3a2200; }

  .delete-btn {
    display: none;
    width: 100%; margin-top: 10px;
    padding: 11px;
    border-radius: 14px;
    border: 1px solid rgba(255,90,112,0.2);
    background: rgba(255,70,92,0.08);
    color: #ff8b9b;
    font-size: 12px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .delete-btn.show { display: block; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 400px) {
    .day-grid { gap: 4px; }
    .dow-row { gap: 4px; font-size: 10px; }
    .month-title { font-size: 15px; }
    .month-nav button { width: 36px; height: 36px; font-size: 18px; }
    .legend { gap: 9px; font-size: 10px; }
    .view-toggle { width: 36px; height: 36px; border-radius: 12px; }
    .loader-svg { width: 180px; height: 180px; }
  }
  @media (min-width: 720px) {
    .day-grid { gap: 8px; }
    .dow-row { gap: 8px; }
    .month-title { font-size: 19px; }
    .day-cell { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<!-- ============ LOADER ============ -->
<div class="loader" id="loader">
  <svg class="loader-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(140,180,255,0)"/>
        <stop offset="50%" stop-color="rgba(180,210,255,0.7)"/>
        <stop offset="100%" stop-color="rgba(235,242,255,1)"/>
      </linearGradient>
      <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="55%" stop-color="#d4dff2"/>
        <stop offset="100%" stop-color="#8fa8d0"/>
      </linearG
